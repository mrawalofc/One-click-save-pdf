<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4 Photo Studio Pro</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>📄 A4 Photo Studio Pro</h1><p>Move • Resize • Crop • Save PDF</p></div><button id="save" class="primary">⬇ Save PDF</button></header>
<section class="bar"><label class="upload">📷 Add Pictures<input id="files" type="file" accept="image/*" multiple></label><label>Page <select id="ori"><option>portrait</option><option>landscape</option></select></label><button id="auto">✨ Auto Arrange</button><button id="ai">🤖 AI Tools</button><button id="clear">Clear</button></section>
<section class="identity"><b>Automatic file name:</b><input id="nick" placeholder="Nickname"><input id="doc" placeholder="Document name"><label><input id="time" type="checkbox" checked> Date & time</label><span id="preview"></span></section>
<main><aside><h3>Selected Photo</h3><div id="none">Select a photo.</div><div id="ctrl" hidden><div class="grid"><label>X mm<input id="x" type="number"></label><label>Y mm<input id="y" type="number"></label><label>Width mm<input id="w" type="number"></label><label>Height mm<input id="h" type="number"></label></div><button id="crop">✂ Crop / Adjust</button><button id="remove">Remove</button></div><hr><h3>AI Future</h3><button disabled>✨ AI Auto Crop</button><button disabled>🧑 ID Photo AI</button><button disabled>🪄 Background AI</button></aside><section class="work"><p id="hint">Upload pictures. Drag a photo to move it; drag the corner to resize.</p><div id="page" class="a4 portrait"></div></section></main>
<div id="modal" hidden><div class="box"><h2>✂ Crop / Adjust</h2><canvas id="canvas" width="600" height="420"></canvas><input id="zoom" type="range" min=".5" max="3" value="1" step=".01"><button id="close">Cancel</button><button id="apply" class="primary">Apply</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="script.js"></script></body></html>
